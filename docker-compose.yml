services:
  rag-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-kb-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # File storage: user uploads + future crawler docs
      - ./backend/data/uploads:/app/data/uploads
      - ./backend/data/crawls:/app/data/crawls
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  rag-network:
    driver: bridge
