<!DOCTYPE html>

<head><meta charset="utf-8"><title>产品帮助中心</title></head>
<body>
<h1>产品帮助中心</h1>
<p>欢迎使用企业知识库系统。本帮助中心整理了账号、数据与检索相关的常见问题，帮助你快速上手核心功能。</p>
<h2>账号管理</h2>
<p>你可以在个人中心修改登录密码、绑定邮箱与手机号。若忘记密码，可通过管理员发起重置流程，重置链接有效期为三十分钟。</p>
<h2>数据导入</h2>
<p>系统支持批量上传文档，单次最多导入五百个文件。上传完成后可在任务列表中查看切片与向量化的处理进度。</p>
<h2>检索与问答</h2>
<p>在对话页输入自然语言问题，系统会自动检索最相关的知识片段并生成带出处的答案。你也可以通过筛选器限定检索的部门与知识库范围。</p>
</body>
</html>
