#!/usr/bin/env bash
# ============================================
# RAG知识库系统 - Docker Compose 容器化部署方案
# ============================================

# ============================================
# 架构概述
# ============================================
# 七容器编排：
#   1. mysql       - MySQL 8.0（业务数据）
#   2. milvus      - Milvus Standalone（向量数据）
#   3. etcd        - Milvus 元数据存储
#   4. minio       - Milvus 对象存储
#   5. redis       - 共享缓存（CACHE_BACKEND=redis 时启用，可选）
#   6. backend     - FastAPI 后端服务
#   7. frontend    - Nginx + Vue3 前端（生产构建）
#
# 网络：rag-network (bridge)
# 数据卷：mysql_data, milvus_data, etcd_data, minio_data, upload_data, crawl_data, redis_data
# ============================================

services:
  # ============================================
  # 1. MySQL 8.0 数据库
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: rag-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rag_kb}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql  # 首次自动建库建表
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password

  # ============================================
  # 2. Milvus Standalone 向量数据库
  # ============================================
  milvus:
    image: milvusdb/milvus:v2.4.17
    container_name: rag-milvus
    restart: unless-stopped
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "9091:9091"  # metrics
    volumes:
      - milvus_data:/var/lib/milvus
    networks:
      - rag-network
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    command: ["milvus", "run", "standalone"]

  # Milvus 依赖：etcd（元数据存储）
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: rag-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  # Milvus 依赖：MinIO（对象存储）
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: rag-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/minio_data
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: minio server /minio_data --console-address ":9001"

  # ============================================
  # 2.5 Redis 共享缓存（CACHE_BACKEND=redis 时启用）
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================
  # 3. FastAPI 后端服务
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env.docker
    environment:
      # 与 config.py 的 APP_WORKERS 共用：既决定 gunicorn worker 数，
      # 也用于推算数据库连接池总占用，避免打穿 MySQL max_connections
      APP_WORKERS: ${APP_WORKERS:-2}
      APP_GRACEFUL_TIMEOUT: ${APP_GRACEFUL_TIMEOUT:-30}
      # 共享缓存：启用 Redis 后多副本/多 worker 共用一份缓存、重启不丢；
      # 连不上 Redis 时后端会自动降级进程内缓存并告警，不影响启动。
      CACHE_BACKEND: ${CACHE_BACKEND:-redis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - upload_data:/app/data/uploads
      - crawl_data:/app/data/crawls
    networks:
      - rag-network
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ============================================
  # 4. Nginx + Vue3 前端（生产构建）
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - rag-network
    depends_on:
      backend:
        condition: service_healthy

# ============================================
# 数据卷定义
# ============================================
volumes:
  mysql_data:
    name: rag_mysql_data
  milvus_data:
    name: rag_milvus_data
  etcd_data:
    name: rag_etcd_data
  minio_data:
    name: rag_minio_data
  upload_data:
    name: rag_upload_data
  crawl_data:
    name: rag_crawl_data
  redis_data:
    name: rag_redis_data

# ============================================
# 网络定义
# ============================================
networks:
  rag-network:
    name: rag_network
    driver: bridge
